<section class="apg">
  <header class="apg__head">
    <div>
      <h1 class="apg__title">Enquiries</h1>
      <p class="apg__sub">Submitted from the public contact form.</p>
    </div>
  </header>

  <p class="apg__error" *ngIf="error()">{{ error() }}</p>
  <p class="apg__notice" *ngIf="notice()">{{ notice() }}</p>
  <p class="apg__muted" *ngIf="loading()">Loading…</p>
  <p class="apg__muted" *ngIf="!loading() && rows().length === 0">No enquiries yet.</p>

  <table class="apg__table" *ngIf="!loading() && rows().length > 0">
    <thead>
      <tr><th>From</th><th>Type</th><th>Message</th><th>Status</th><th>Notes</th><th></th></tr>
    </thead>
    <tbody>
      <tr *ngFor="let r of rows()">
        <td>
          <strong>{{ r['name'] }}</strong>
          <div class="apg__muted-sm" *ngIf="r['email']">{{ r['email'] }}</div>
          <div class="apg__muted-sm" *ngIf="r['mobile']">{{ r['mobile'] }}</div>
          <div class="apg__muted-sm" *ngIf="r['city']">{{ r['city'] }}</div>
        </td>
        <td>{{ r['enquiry_type'] || '—' }}</td>
        <td>{{ r['message'] }}</td>
        <td>
          <select class="apg__select" [(ngModel)]="r.status" [disabled]="busyId() === r.id">
            <option *ngFor="let s of statuses" [ngValue]="s">{{ s }}</option>
          </select>
        </td>
        <td class="apg__notes">
          <textarea class="apg__textarea" rows="2" [(ngModel)]="r.admin_notes" placeholder="Internal notes…"></textarea>
        </td>
        <td>
          <button class="apg__btn apg__btn--primary" type="button" [disabled]="busyId() === r.id" (click)="save(r)">Save</button>
        </td>
      </tr>
    </tbody>
  </table>
</section>
