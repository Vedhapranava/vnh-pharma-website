<div class="admin-login">
  <form class="admin-login__card" (ngSubmit)="onSubmit()">
    <h1 class="admin-login__title">VNH Admin</h1>
    <p class="admin-login__subtitle">Sign in to manage the website</p>

    <label class="admin-login__label" for="email">Email</label>
    <input
      id="email"
      class="admin-login__input"
      type="email"
      name="email"
      [(ngModel)]="email"
      autocomplete="username"
      required
    />

    <label class="admin-login__label" for="password">Password</label>
    <input
      id="password"
      class="admin-login__input"
      type="password"
      name="password"
      [(ngModel)]="password"
      autocomplete="current-password"
      required
    />

    <p class="admin-login__error" *ngIf="error">{{ error }}</p>

    <button class="admin-login__button" type="submit" [disabled]="loading">
      {{ loading ? 'Signing in…' : 'Sign in' }}
    </button>
  </form>
</div>
